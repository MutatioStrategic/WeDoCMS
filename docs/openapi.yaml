openapi: 3.0.3
info:
  title: Veld Archive API
  version: 0.1.0
  description: Core API for trusted South African visual discovery, ingestion, rights, and governance.
servers:
  - url: https://archive.example.com
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Return the current browser session
      responses:
        '200':
          description: Authenticated or anonymous session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/exchange:
    post:
      operationId: exchangeIdentityToken
      summary: Exchange a verified bearer identity token for a session cookie
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/assets:
    get:
      operationId: searchAssets
      summary: Search published assets
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 240, default: '' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, image, video], default: all }
        - name: location
          in: query
          schema: { type: string, maxLength: 80 }
        - name: locationType
          in: query
          description: Pixel-derived visible setting classification; never a geographic claim
          schema: { type: string, enum: [urban_street, coastal_landscape, market_scene, indoor, residential, rural_landscape, industrial, event, transport, nature, sports, food, other, unknown] }
        - name: category
          in: query
          schema: { type: string, enum: [people, lifestyle, travel, nature, architecture, food, business, transport, arts_culture, sport, news_editorial, objects, other] }
        - name: status
          in: query
          schema: { type: string, enum: [published, needs_review, all], default: published }
      responses:
        '200':
          description: Explainable search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createAsset
      summary: Create an asset metadata record
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: Asset created
          headers:
            Location:
              description: Relative URL of the created asset resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetCreateResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Metadata or pricing rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
                additionalProperties: false
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches:
    get:
      operationId: listPayoutBatches
      summary: List payout batches awaiting review or processing
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Payout batches
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/PayoutBatchSummary' } }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createPayoutBatch
      summary: Create a payout batch draft for admin approval
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutBatchRequest' }
      responses:
        '201':
          description: Draft created; no provider payout has started
          headers:
            Location:
              description: Relative URL of the draft payout batch
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchCreateResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches/{id}:
    get:
      operationId: getPayoutBatch
      summary: Inspect payout contributors and batch status
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Payout batch detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDetail' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Payout batch not found in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches/{id}/decision:
    post:
      operationId: decidePayoutBatch
      summary: Approve or reject a payout batch before provider processing
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutBatchDecisionRequest' }
      responses:
        '200':
          description: Draft rejected or idempotent decision confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDecisionResponse' }
        '202':
          description: Draft approved and provider processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDecisionResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Batch is no longer a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/governance/assets/{id}/action:
    post:
      operationId: runGovernanceAction
      summary: Correct metadata, approve, or reject an asset; upload completion runs AI once
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceActionRequest' }
      responses:
        '200':
          description: Governance state updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceActionResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Governance rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: AI enrichment is upload-only and cannot be requested from governance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/photo-jobs:
    get:
      operationId: listPhotoJobs
      summary: List enrichment and index jobs for operational review
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, queued, running, completed, needs_review, failed, dead_lettered, skipped], default: all }
      responses:
        '200':
          description: Tenant-scoped photo jobs
          content:
            application/json:
              schema:
                type: object
                required: [status, results]
                properties:
                  status: { type: string }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                additionalProperties: true
        '403':
          description: Editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/approval-ledger:
    get:
      operationId: listAdminApprovalLedger
      summary: List tenant-scoped user-account and image approval sign-offs
      security:
        - sessionCookie: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [all, user_account, image], default: all }
        - name: source
          in: query
          schema: { type: string, enum: [all, signed_audit, workflow_event], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Approval ledger rows with integrity state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalLedgerResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/photo-jobs/{jobId}/provenance:
    get:
      operationId: getPhotoJobProvenance
      summary: Inspect model, revision, prompt/schema version, attempt, and review outcomes
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Photo job provenance
          content:
            application/json:
              schema:
                type: object
                required: [jobId, results]
                properties:
                  jobId: { type: string }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                additionalProperties: true
  /api/admin/photo-jobs/{jobId}/replay:
    post:
      operationId: replayPhotoJob
      summary: Replay a failed index-sync job; upload-time AI enrichment is never replayed
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Job queued for a fresh bounded attempt
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status, replayed]
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [queued] }
                  replayed: { type: boolean, enum: [true] }
                additionalProperties: false
        '404':
          description: Replayable job not found in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: AI enrichment is upload-only or the job is not replayable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads:
    post:
      operationId: createUploadSession
      summary: Create a direct R2 upload session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Short-lived upload URL returned
          headers:
            Location:
              description: Relative URL of the upload completion resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '401':
          description: Contributor authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      summary: Verify the R2 object and complete ingestion
      security:
        - sessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Upload completed or idempotently confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompleteResponse' }
        '403':
          description: Upload ownership check failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Upload session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/checkout/validate:
    post:
      operationId: validateCheckout
      summary: Validate rights and releases before checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenceRequest' }
      responses:
        '200':
          description: Licence validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutValidationResponse' }
        '404':
          description: Asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Invalid licence request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/payments/{licenceId}/session:
    post:
      operationId: createPaymentSession
      summary: Create a hosted payment-provider checkout session for a pending licence
      security:
        - sessionCookie: []
      parameters:
        - name: licenceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '201':
          description: Hosted checkout URL returned
          headers:
            Location:
              description: Relative URL of the hosted payment session resource
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [licenceId, provider, checkoutUrl, status]
                properties:
                  licenceId: { type: string }
                  provider: { type: string }
                  checkoutUrl: { type: string }
                  status: { type: string }
                additionalProperties: true
        '401':
          description: Authenticated buyer required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Payment provider is unavailable or unconfigured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/webhooks/payments:
    post:
      operationId: receivePaymentWebhook
      summary: Receive a signed payment, refund, or chargeback event
      parameters:
        - name: x-payment-signature
          in: header
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Event accepted or already processed
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/security/turnstile:
    post:
      operationId: verifyTurnstile
      summary: Server-side Turnstile verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, action]
              properties:
                token: { type: string, minLength: 1, maxLength: 2048 }
                action: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { type: object, required: [verified], properties: { verified: { type: boolean }, reason: { type: string } }, additionalProperties: false }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: va_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        retryAfter: { type: integer, minimum: 0 }
        quotaBytes: { type: integer, minimum: 1 }
        uploadId: { type: string }
        issues:
          type: array
          items:
            type: object
            required: [path, code]
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - { type: string }
                    - { type: integer }
              code: { type: string }
      additionalProperties: true
    ApprovalLedgerResponse:
      type: object
      required: [organization, filters, summary, results]
      properties:
        organization:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
          additionalProperties: false
        filters:
          type: object
          required: [category, source, limit]
          properties:
            category: { type: string, enum: [all, user_account, image] }
            source: { type: string, enum: [all, signed_audit, workflow_event] }
            limit: { type: integer, minimum: 1, maximum: 500 }
          additionalProperties: false
        summary:
          type: object
          required: [total, userAccount, image, signedAudit, legacyWorkflow, verifiedIntegrity, failedIntegrity]
          properties:
            total: { type: integer, minimum: 0 }
            userAccount: { type: integer, minimum: 0 }
            image: { type: integer, minimum: 0 }
            signedAudit: { type: integer, minimum: 0 }
            legacyWorkflow: { type: integer, minimum: 0 }
            verifiedIntegrity: { type: integer, minimum: 0 }
            failedIntegrity: { type: integer, minimum: 0 }
          additionalProperties: false
        results:
          type: array
          items:
            type: object
            required: [id, category, source, occurredAt, action, decision, actor, subject, resource, streamId, sequence, notes, integrity]
            properties:
              id: { type: string }
              category: { type: string, enum: [user_account, image] }
              source: { type: string, enum: [signed_audit, workflow_event] }
              occurredAt: { type: string }
              action: { type: string }
              decision: { type: string }
              actor: { type: object, additionalProperties: true }
              subject: { type: object, additionalProperties: true }
              resource: { type: object, additionalProperties: true }
              streamId: { type: string, nullable: true }
              sequence: { type: integer, nullable: true }
              notes: { type: string, nullable: true }
              integrity: { type: object, additionalProperties: true }
            additionalProperties: false
      additionalProperties: false
    HealthResponse:
      type: object
      required: [ok, service, environment]
      properties:
        ok: { type: boolean, enum: [true] }
        service: { type: string, enum: [veld-archive-api] }
        environment: { type: string }
      additionalProperties: false
    SessionUser:
      type: object
      required: [id, email, displayName, role, onboardingStatus, organizationId, organizationName, residencyRegion, sessionId, csrfToken]
      properties:
        id: { type: string }
        email: { type: string }
        displayName: { type: string }
        role: { type: string }
        onboardingStatus: { type: string }
        organizationId: { type: string }
        organizationName: { type: string }
        residencyRegion: { type: string, enum: [za, eu] }
        sessionId: { type: string }
        csrfToken: { type: string }
      additionalProperties: false
    SessionResponse:
      oneOf:
        - type: object
          required: [authenticated, user]
          properties:
            authenticated: { type: boolean, enum: [false] }
            user: { type: object, nullable: true }
          additionalProperties: false
        - $ref: '#/components/schemas/AuthenticatedSessionResponse'
    AuthenticatedSessionResponse:
      type: object
      required: [authenticated, user, csrfToken]
      properties:
        authenticated: { type: boolean, enum: [true] }
        user: { $ref: '#/components/schemas/SessionUser' }
        csrfToken: { type: string }
      additionalProperties: false
    ExchangeRequest:
      type: object
      properties:
        organizationId: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false
    Asset:
      type: object
      required: [id, kind, status, title, description, caption, country, province, city, locality, landmark, subjectTags, culturalTags, rightsStatus, modelReleaseStatus, propertyReleaseStatus, authenticityConfidence, humanVerified, contributor, workflowStage, aiTags, curatorNotes]
      properties:
        id: { type: string }
        kind: { type: string, enum: [image, video] }
        status: { type: string, enum: [draft, processing, needs_review, published, rejected, withdrawn] }
        title: { type: string }
        description: { type: string }
        caption: { type: string }
        country: { type: string }
        province: { type: string, nullable: true }
        city: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        landmark: { type: string, nullable: true }
        subjectTags: { type: array, items: { type: string } }
        culturalTags: { type: array, items: { type: string } }
        rightsStatus: { type: string, enum: [pending, verified, restricted, editorial_only] }
        modelReleaseStatus: { type: string, enum: [unknown, not_required, pending, verified] }
        propertyReleaseStatus: { type: string, enum: [unknown, not_required, pending, verified] }
        authenticityConfidence: { type: number, minimum: 0, maximum: 1 }
        aiConfidence: { type: number, minimum: 0, maximum: 1 }
        humanVerified: { type: boolean }
        contributor: { type: string }
        workflowStage: { type: string, enum: [ingestion, ai_tagging, curator_correction, approval] }
        aiTags: { type: array, items: { type: string } }
        visualLocationType: { type: string, enum: [urban_street, coastal_landscape, market_scene, indoor, residential, rural_landscape, industrial, event, transport, nature, sports, food, other, unknown] }
        primaryCategory: { type: string, enum: [people, lifestyle, travel, nature, architecture, food, business, transport, arts_culture, sport, news_editorial, objects, other] }
        sceneAttributes: { type: array, items: { type: string } }
        visibleText: { type: string }
        detectedLanguage: { type: string }
        textReadability: { type: string, enum: [clear, partial, unreadable, no_text] }
        ocrConfidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        aiFieldConfidences: { type: object, additionalProperties: { type: number, minimum: 0, maximum: 1 } }
        enrichmentValidation: { type: object, additionalProperties: true }
        geographicLocationSource: { type: string, enum: [none, seller, exif, evidence, editor] }
        assetRevision: { type: integer, minimum: 1 }
        enrichedRevision: { type: integer, minimum: 1, nullable: true }
        reviewedRevision: { type: integer, minimum: 1, nullable: true }
        approvedRevision: { type: integer, minimum: 1, nullable: true }
        indexedRevision: { type: integer, minimum: 1, nullable: true }
        vectorIndexStatus: { type: string, enum: [not_indexed, pending, indexed, error] }
        curatorNotes: { type: string }
        metadataReviewStatus: { type: string, enum: [reviewed, needs_context, blocked] }
        metadataReviewNote: { type: string }
        metadataProvenance: { type: string, enum: [contributor, editor, ai_suggested] }
        sourceFileName: { type: string, nullable: true }
        sourceUrl: { type: string, nullable: true }
        sourceLicense: { type: string, nullable: true }
        sourceAttribution: { type: string, nullable: true }
        monetizationModel: { type: string, enum: [membership, individual_license, custom_quote] }
        licensePriceCents: { type: integer, minimum: 0, nullable: true }
      additionalProperties: true
    SearchResponse:
      type: object
      required: [query, mode, results, facets]
      properties:
        query: { type: string }
        mode: { type: string, enum: [keyword, semantic-preview, hybrid] }
        results: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        facets:
          type: array
          items:
            type: object
            required: [label, value, count]
            properties:
              label: { type: string }
              value: { type: string }
              count: { type: integer, minimum: 0 }
            additionalProperties: false
      additionalProperties: false
    AssetCreateRequest:
      type: object
      required: [kind, title]
      properties:
        kind: { type: string, enum: [image, video] }
        title: { type: string, minLength: 3, maxLength: 240 }
        description: { type: string, maxLength: 4000, default: '' }
        caption: { type: string, maxLength: 4000, default: '' }
        province: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 120 }
        locality: { type: string, maxLength: 160 }
