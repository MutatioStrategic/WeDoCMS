openapi: 3.0.3
info:
  title: Veld Archive API
  version: 0.1.0
  description: Core API for trusted South African visual discovery, ingestion, rights, and governance.
servers:
  - url: https://archive.example.com
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Return the current browser session
      responses:
        '200':
          description: Authenticated or anonymous session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/exchange:
    post:
      operationId: exchangeIdentityToken
      summary: Exchange a verified bearer identity token for a session cookie
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/assets:
    get:
      operationId: searchAssets
      summary: Search published assets
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 240, default: '' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, image, video], default: all }
        - name: location
          in: query
          schema: { type: string, maxLength: 80 }
        - name: status
          in: query
          schema: { type: string, enum: [published, needs_review, all], default: published }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, newest, popular, random], default: relevance }
        - name: orientation
          in: query
          schema: { type: string, enum: [all, landscape, portrait, square], default: all }
        - name: usage
          in: query
          schema: { type: string, enum: [all, commercial, editorial], default: all }
        - name: people
          in: query
          schema: { type: string, enum: [all, with_people, without_people], default: all }
        - name: ai
          in: query
          schema: { type: string, enum: [all, ai_generated, not_ai_generated], default: all }
        - name: exclude
          in: query
          schema: { type: string, maxLength: 240 }
        - name: cursor
          in: query
          schema: { type: string, pattern: '^\\d+$' }
      responses:
        '200':
          description: Explainable search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createAsset
      summary: Create an asset metadata record
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetCreateResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Metadata or pricing rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes:
    get:
      operationId: listLightboxes
      summary: List the current user's lightboxes
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant-scoped lightboxes
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/Lightbox' } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createLightbox
      summary: Create a private lightbox
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                visibility: { type: string, enum: [private, shared], default: private }
              additionalProperties: false
      responses:
        '201':
          description: Lightbox created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lightbox' }
        '409':
          description: Duplicate lightbox name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/assets:
    post:
      operationId: saveAssetToLightbox
      summary: Save a published asset to a lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Asset saved (idempotent) }
        '404':
          description: Lightbox or published asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/assets/{assetId}:
    delete:
      operationId: removeAssetFromLightbox
      summary: Remove an asset from a lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Asset removed }
  /api/lightboxes/{id}:
    delete:
      operationId: deleteLightbox
      summary: Delete an owned lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Lightbox deleted }
        '404':
          description: Lightbox not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/share-link:
    post:
      operationId: createLightboxShareLink
      summary: Create or rotate a public lightbox share link
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Share link created }
        '404': { description: Lightbox not found }
  /api/lightboxes/{id}/members:
    post:
      operationId: addLightboxMember
      summary: Add an organization member as viewer or editor
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Member added }
        '422': { description: Member is outside the organization }
  /api/lightboxes/shared/{token}:
    get:
      operationId: viewSharedLightbox
      summary: View a published shared lightbox without authentication
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Shared lightbox and published assets }
        '404': { description: Shared lightbox not found }
  /api/search/visual:
    post:
      operationId: visualSearch
      summary: Find visually related published photography from an uploaded image
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '200': { description: Related assets returned }
        '400': { description: The multipart image field is missing or invalid }
        '413': { description: Image exceeds 10 MB limit }
        '503': { description: Visual search is not configured }
  /api/creators:
    get:
      operationId: listCreators
      summary: Discover contributors who explicitly published a public profile
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Public creator profiles
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/CreatorProfile' } }
  /api/creators/{slug}:
    get:
      operationId: getCreator
      summary: Return one public creator profile with published assets and collections
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{3,100}$' } }
      responses:
        '200': { description: Public creator detail }
        '404': { description: Creator not found or not public }
  /api/licence-products:
    get:
      operationId: listLicenceProducts
      summary: Return active, versioned licence products and restrictions
      responses:
        '200':
          description: Active licence products
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/LicenceProduct' } }
  /api/discovery:
    get:
      operationId: getDiscovery
      summary: Return privacy-thresholded trends and optional personalized discovery
      responses:
        '200':
          description: Public trends plus tenant-scoped saved searches and recommendations when authenticated
          content:
            application/json:
              schema:
                type: object
                required: [trending, savedSearches, recommendations, personalized]
                properties:
                  trending:
                    type: array
                    items:
                      type: object
                      required: [query, searchCount]
                      properties: { query: { type: string }, searchCount: { type: integer, minimum: 3 } }
                  savedSearches: { type: array, items: { $ref: '#/components/schemas/SavedSearch' } }
                  recommendations:
                    type: array
                    items:
                      type: object
                      required: [asset, reason]
                      properties: { asset: { $ref: '#/components/schemas/Asset' }, reason: { type: string } }
                  personalized: { type: boolean }
  /api/saved-searches:
    post:
      operationId: createSavedSearch
      summary: Save a tenant-scoped search and optional in-app alert cadence
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchInput' }
      responses:
        '201':
          description: Saved search created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '409':
          description: Duplicate saved-search name
  /api/saved-searches/{id}:
    patch:
      operationId: updateSavedSearch
      summary: Update an owned saved search or alert cadence
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchInput' }
      responses:
        '200':
          description: Saved search updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
    delete:
      operationId: deleteSavedSearch
      summary: Delete an owned saved search
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Saved search deleted }
        '404': { description: Saved search not found }
  /api/ops/readiness:
    get:
      operationId: getProductionReadiness
      summary: Return the admin-only fail-closed production readiness gate
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Readiness checks without secret values
          content:
            application/json:
              schema:
                type: object
                required: [ready, checkedAt, checks]
                properties:
                  ready: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, ready, action]
                      properties: { id: { type: string }, ready: { type: boolean }, action: { type: string } }
        '403': { description: Admin access required }
  /api/onboarding/seller:
    put:
      operationId: saveSellerOnboarding
      summary: Persist the authenticated seller profile and versioned seller agreement acceptance
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Seller profile saved }
        '403': { description: Contributor access required }
        '422': { description: Invalid or incomplete seller profile }
  /api/onboarding/cipc/lookup:
    post:
      operationId: verifyCipcRegistration
      summary: Verify the saved company registration through the configured CIPC adapter
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Company registration verified }
        '409': { description: A matching company seller profile is required }
        '503': { description: CIPC integration is unavailable or unconfigured }
  /api/onboarding/didit/session:
    post:
      operationId: createDiditVerificationSession
      summary: Create a hosted Didit KYC or KYB session for the authenticated seller
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Didit hosted verification session created }
        '409': { description: Seller or CIPC prerequisite is incomplete }
        '503': { description: Didit integration is unavailable or unconfigured }
  /api/webhooks/didit:
    post:
      operationId: receiveDiditWebhook
      summary: Receive a signed, timestamped, deduplicated Didit decision event
      parameters:
        - { name: x-signature-v2, in: header, required: false, schema: { type: string } }
        - { name: x-signature, in: header, required: false, schema: { type: string } }
        - { name: x-timestamp, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Event accepted or already processed }
        '401': { description: Invalid or stale signature }
  /api/subscription:
    get:
      operationId: getBuyerSubscription
      summary: Return the signed-in buyer's canonical Paystack subscription, monthly/annual plans, and payment history
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Subscription state and plan configuration }
  /api/subscription/session:
    post:
      operationId: createBuyerSubscriptionSession
      summary: Start hosted checkout for the selected monthly or annual Paystack recurring plan
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successUrl, cancelUrl]
              properties:
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
                plan: { type: string, enum: [monthly, annual], default: monthly }
      responses:
        '201': { description: Hosted subscription checkout created }
        '409': { description: Subscription is already active or pending }
        '503': { description: Paystack plan is unconfigured or unavailable }
  /api/my/free-downloads:
    get:
      operationId: getIntroductoryFreeDownloads
      summary: Return the authenticated buyer's one-time introductory photo allowance
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: "Allowance limit, used count, remaining count, and claimed photo history" }
        '401': { description: Authentication required }
  /api/assets/{id}/original:
    get:
      operationId: downloadOriginalAsset
      summary: Download an original using a licence, bundle credit, subscription, owner, staff, or introductory allowance entitlement
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '302': { description: Short-lived signed R2 download redirect }
        '403': { description: Entitlement missing or introductory allowance exhausted }
  /api/buyer/credits/checkout:
    post:
      operationId: createBuyerCreditBundleCheckout
      summary: Start a once-off checkout for archive download credits
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credits, successUrl, cancelUrl]
              properties:
                credits: { type: integer, minimum: 1, maximum: 1000 }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        '201': { description: Once-off credit checkout created }
        '503': { description: Payment provider is unavailable or unconfigured }
  /api/subscription/manage-link:
    post:
      operationId: createBuyerSubscriptionManageLink
      summary: Create a short-lived Paystack-hosted billing management link
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Management link created }
        '404': { description: No manageable subscription found }
  /api/governance/assets/{id}/action:
    post:
      operationId: runGovernanceAction
      summary: Run tagging, correct metadata, approve, or reject an asset
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceActionRequest' }
      responses:
        '200':
          description: Governance state updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceActionResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Governance rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads:
    post:
      operationId: createUploadSession
      summary: Create a direct R2 upload session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Short-lived upload URL returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '401':
          description: Contributor authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      summary: Verify the R2 object and complete ingestion
      security:
        - sessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Upload completed or idempotently confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompleteResponse' }
        '403':
          description: Upload ownership check failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Upload session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/legal/agreements:
    get:
      operationId: listMarketplaceAgreements
      summary: Read the current versioned marketplace agreements
      responses:
        '200':
          description: Seller, buyer, and payment terms that are displayed before acceptance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceAgreementsResponse' }
  /api/checkout/validate:
    post:
      operationId: validateCheckout
      summary: Validate rights and releases before checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenceRequest' }
      responses:
        '200':
          description: Licence validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutValidationResponse' }
        '404':
          description: Asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Invalid licence request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/checkout:
    post:
      operationId: createLicenceCheckout
      summary: Create or reuse a licence contract and accepted terms
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutRequest' }
      responses:
        '200':
          description: Existing pending licence contract reused
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenceCheckoutResponse' }
        '201':
          description: Pending licence contract created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LicenceCheckoutResponse' }
        '401':
          description: Authenticated buyer required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Rights, release, or terms validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/payments/{licenceId}/session:
    post:
      operationId: createPaymentSession
      summary: Create a hosted payment-provider checkout session for a pending licence
      security:
        - sessionCookie: []
      parameters:
        - name: licenceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutSessionRequest' }
      responses:
        '201':
          description: Hosted checkout URL returned
          content:
            application/json:
              schema: { type: object, required: [licenceId, provider, checkoutUrl, status], additionalProperties: true }
        '401':
          description: Authenticated buyer required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Payment provider is unavailable or unconfigured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/demo/payments/{licenceId}/complete:
    get:
      operationId: completeDemoLicencePayment
      summary: Complete a licence through the explicitly non-production demo checkout
      description: Demo-only server-side payment simulation. Production payment state is established by a verified provider webhook.
      security:
        - sessionCookie: []
      parameters:
        - name: licenceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '303':
          description: Licence marked paid in demo and redirected to the buyer account
        '401':
          description: Authenticated buyer required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Demo checkout disabled or licence not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Licence has not been initialized for demo checkout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Demo settlement failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/webhooks/payments:
    post:
      operationId: receivePaymentWebhook
      summary: Receive a signed payment, refund, or chargeback event
      parameters:
        - name: x-payment-signature
          in: header
          required: false
          schema: { type: string, minLength: 1 }
        - name: x-paystack-signature
          in: header
          required: false
          description: Paystack HMAC-SHA512 signature over the raw JSON body
          schema: { type: string, minLength: 128, maxLength: 128 }
      responses:
        '200':
          description: Event accepted or already processed
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401':
          description: Invalid signature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/security/turnstile:
    post:
      operationId: verifyTurnstile
      summary: Server-side Turnstile verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, action]
              properties:
                token: { type: string, minLength: 1, maxLength: 2048 }
                action: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { type: object, required: [verified], properties: { verified: { type: boolean }, reason: { type: string } }, additionalProperties: false }
  /api/campaigns/{id}:
    get:
      operationId: getCampaignDeliveryDetail
      summary: Get a tenant-scoped campaign with licences, edit versions, derivatives, blockers, and bundle history
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Campaign delivery detail, content: { application/json: { schema: { $ref: '#/components/schemas/CampaignDetail' } } } }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Campaign not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/assets/{id}/edit-versions:
    get:
      operationId: listAssetEditVersions
      summary: List authenticated edit versions for an asset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Edit versions, content: { application/json: { schema: { $ref: '#/components/schemas/EditVersionListResponse' } } } }
        '403': { description: Active licence or reviewer access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    post:
      operationId: createAssetEditVersion
      summary: Create an immutable-original edit version for a licensed campaign asset
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/EditVersionRequest' } } }
      responses:
        '201': { description: Edit version created, content: { application/json: { schema: { $ref: '#/components/schemas/EditVersion' } } } }
        '403': { description: Licence or campaign access failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Rights or release blocker, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/assets/{id}/derivatives:
    post:
      operationId: createAssetDerivative
      summary: Register a derivative before uploading its authenticated content
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DerivativeRequest' } } }
      responses:
        '201': { description: Derivative registered, content: { application/json: { schema: { $ref: '#/components/schemas/Derivative' } } } }
        '403': { description: Licence or campaign access failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/assets/{id}/derivatives/{derivativeId}/content:
    get:
      operationId: getDerivativeContent
      summary: Stream ready derivative content through an authenticated route
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: derivativeId, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200': { description: Derivative content }
        '206': { description: Partial derivative content }
        '403': { description: Authenticated licence access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: Derivative not ready or not found, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    put:
      operationId: uploadDerivativeContent
      summary: Upload derivative bytes through the authenticated content route
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: derivativeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } }
      responses:
        '200': { description: Derivative ready, content: { application/json: { schema: { $ref: '#/components/schemas/Derivative' } } } }
        '403': { description: Authenticated licence access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '413': { description: Derivative too large, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/campaigns/{id}/bundles:
    post:
      operationId: requestCampaignBundle
      summary: Request a rights-checked campaign bundle
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BundleRequest' } } }
      responses:
        '201': { description: Bundle requested, content: { application/json: { schema: { $ref: '#/components/schemas/Bundle' } } } }
        '422': { description: Bundle blockers, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/campaigns/{id}/bundles/{bundleId}/approve:
    post:
      operationId: approveCampaignBundle
      summary: Build and approve a streamed, auditable campaign ZIP
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: bundleId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Bundle approved, content: { application/json: { schema: { $ref: '#/components/schemas/Bundle' } } } }
        '409': { description: Build already in progress or bundle not rebuildable, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Bundle build failed or rights blockers remain, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/campaign-bundles/{id}/download:
    get:
      operationId: downloadCampaignBundle
      summary: Download an approved campaign bundle within its seven-day expiry
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Authenticated ZIP download, content: { application/zip: { schema: { type: string, format: binary } } } }
        '403': { description: Organization authorization failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '410': { description: Bundle expired, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/rights/cases/{id}/transition:
    post:
      operationId: transitionRightsCase
      summary: Apply a permitted reviewer rights-case transition
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RightsTransitionRequest' } } }
      responses:
        '200': { description: Rights transition recorded, content: { application/json: { schema: { $ref: '#/components/schemas/RightsTransitionResponse' } } } }
        '403': { description: Actor is not authorized, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Invalid or concurrent transition, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/rights/cases/{id}/appeal:
    post:
      operationId: appealRightsCase
      summary: Appeal a resolved rights case as requester or asset owner
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RightsAppealRequest' } } }
      responses:
        '200': { description: Appeal recorded, content: { application/json: { schema: { $ref: '#/components/schemas/RightsTransitionResponse' } } } }
        '403': { description: Requester or asset owner required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: Case is not resolved, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/assets/{id}/stream-upload:
    post:
      operationId: provisionStreamUpload
      summary: Provision a signed Cloudflare Stream direct upload for an owned video
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, maxLength: 180 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StreamUploadRequest' } } }
      responses:
        '201': { description: Direct upload provisioned, content: { application/json: { schema: { $ref: '#/components/schemas/StreamUpload' } } } }
        '503': { description: Stream is not configured, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/assets/{id}/stream-playback:
    get:
      operationId: getStreamPlayback
      summary: Get a short-lived signed Stream playback URL for an authorized viewer
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Signed playback URL, content: { application/json: { schema: { $ref: '#/components/schemas/StreamPlayback' } } } }
        '409': { description: Stream is not ready, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/webhooks/stream:
    post:
      operationId: receiveStreamWebhook
      summary: Verify and persist a timestamped Cloudflare Stream status callback
      parameters:
        - { name: Webhook-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StreamWebhookRequest' } } }
      responses:
        '200': { description: Webhook accepted or duplicate, content: { application/json: { schema: { $ref: '#/components/schemas/StreamWebhookResponse' } } } }
        '401': { description: Invalid signature, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/audit/events/{streamId}:
    get:
      operationId: listAuditEvents
      summary: List organization-scoped signed audit events for a permitted stream
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: streamId, in: path, required: true, schema: { type: string } }
        - { name: residencyRegion, in: query, required: false, schema: { type: string, enum: [za, eu] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        '200': { description: Signed audit events, content: { application/json: { schema: { $ref: '#/components/schemas/AuditEventsResponse' } } } }
  /api/audit/exports:
    post:
      operationId: createAuditExport
      summary: Create a residency- and organization-scoped audit export
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportRequest' } } }
      responses:
        '201': { description: Audit export created, content: { application/json: { schema: { $ref: '#/components/schemas/AuditExportResponse' } } } }
  /api/audit/exports/{exportId}:
    get:
      operationId: downloadAuditExport
      summary: Download an audit export only as its owning organization administrator or service
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Audit JSON export, content: { application/json: { schema: { type: string, format: binary } } } }
        '403': { description: Organization or residency authorization failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/verification/cases/{caseId}:
    get:
      operationId: getVerificationCase
      summary: Get a residency- and organization-scoped verification case without private object keys
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Verification case, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationCaseResponse' } } } }
        '403': { description: Organization or residency authorization failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/verification/cases/{caseId}/documents:
    post:
      operationId: registerVerificationDocument
      summary: Register KYC document metadata before authenticated content upload
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/VerificationDocumentRequest' } } }
      responses:
        '201': { description: Document upload handle, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationDocumentResponse' } } } }
  /api/verification/documents/{documentId}/content:
    put:
      operationId: uploadVerificationDocumentContent
      summary: Upload KYC document bytes through an authenticated, scoped route
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        '200': { description: Document uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationDocumentUploadResponse' } } } }
        '403': { description: Organization or residency authorization failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/verification/documents/{documentId}/ocr:
    post:
      operationId: runVerificationDocumentOcr
      summary: Run organization-scoped assistive OCR on an uploaded KYC document
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OCR result, content: { application/json: { schema: { $ref: '#/components/schemas/VerificationOcrResponse' } } } }
        '403': { description: Organization or residency authorization failed, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: va_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CampaignDetail:
      type: object
      required: [campaign, recommendations, assets, editVersions, derivatives, bundles, licenceMetadata, blockers]
      properties:
        campaign: { type: object, additionalProperties: true }
        recommendations: { type: array, items: { type: object, additionalProperties: true } }
        assets: { type: array, items: { $ref: '#/components/schemas/CampaignAsset' } }
        editVersions: { type: array, items: { $ref: '#/components/schemas/EditVersion' } }
        derivatives: { type: array, items: { $ref: '#/components/schemas/Derivative' } }
        bundles: { type: array, items: { $ref: '#/components/schemas/Bundle' } }
        licenceMetadata: { type: array, items: { $ref: '#/components/schemas/LicenceMetadata' } }
        blockers: { type: array, items: { $ref: '#/components/schemas/CampaignBlockers' } }
        buyerTermsAccepted: { type: boolean }
      additionalProperties: true
    CampaignAsset:
      allOf:
        - $ref: '#/components/schemas/Asset'
        - type: object
          required: [campaignStage, campaignNote, activeLicenceId]
          properties:
            campaignStage: { type: string, enum: [shortlisted, rejected, approved, needs_review] }
            campaignNote: { type: string }
            activeLicenceId: { type: string, nullable: true }
    CampaignBlockers:
      type: object
      required: [assetId, blockers]
      properties:
        assetId: { type: string }
        blockers: { type: array, items: { $ref: '#/components/schemas/DeliveryBlocker' } }
    DeliveryBlocker:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
    LicenceMetadata:
      type: object
      required: [assetId, licenceId, licenceType, territory, expiresAt]
      properties:
        assetId: { type: string }
        licenceId: { type: string, nullable: true }
        licenceType: { type: string, nullable: true }
        territory: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
    EditVersionRequest:
      type: object
      required: [campaignId, licenceId]
      properties:
        campaignId: { type: string }
        licenceId: { type: string }
        recipe: { type: object, additionalProperties: true, default: {} }
        note: { type: string, maxLength: 1000, default: '' }
      additionalProperties: false
    EditVersion:
      type: object
      required: [id, assetId, versionNumber, recipe, note, createdAt]
      properties:
        id: { type: string }
        assetId: { type: string }
        versionNumber: { type: integer, minimum: 1 }
        recipe: { type: object, additionalProperties: true }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        auditEventId: { type: string }
      additionalProperties: true
    EditVersionListResponse:
      type: object
      required: [assetId, results]
      properties:
        assetId: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/EditVersion' } }
      additionalProperties: false
    DerivativeRequest:
      type: object
      required: [editVersionId, campaignId, licenceId, variant, contentType, sizeBytes]
      properties:
        editVersionId: { type: string }
        campaignId: { type: string }
        licenceId: { type: string }
        variant: { type: string, enum: [edited, social_square, portrait, landscape, story_9_16, reel_cover, linkedin, web_hero, email_header] }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 50000000 }
        width: { type: integer, minimum: 1, nullable: true }
        height: { type: integer, minimum: 1, nullable: true }
      additionalProperties: false
    Derivative:
      type: object
      required: [id, assetId, editVersionId, licenceId, variant, status, contentType, sizeBytes, contentUrl, createdAt]
      properties:
        id: { type: string }
        assetId: { type: string }
        editVersionId: { type: string }
        campaignId: { type: string, nullable: true }
        licenceId: { type: string }
        variant: { type: string, enum: [edited, social_square, portrait, landscape, story_9_16, reel_cover, linkedin, web_hero, email_header] }
        status: { type: string, enum: [pending, ready, failed, revoked] }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1, nullable: true }
        height: { type: integer, minimum: 1, nullable: true }
        contentUrl: { type: string, pattern: '^/' }
        createdAt: { type: string, format: date-time }
        auditEventId: { type: string }
      additionalProperties: true
    BundleRequest:
      type: object
      required: [bundleType]
      properties:
        bundleType: { type: string, enum: [social_media, website, paid_ads, print_handoff, full_archive] }
      additionalProperties: false
    Bundle:
      type: object
      required: [id, campaignId, bundleType, status, createdAt]
      properties:
        id: { type: string }
        campaignId: { type: string }
        bundleType: { type: string }
        status: { type: string, enum: [pending, building, approved, expired, revoked, failed] }
        buildStatus: { type: string, nullable: true }
        error: { type: string, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        download: { type: string, pattern: '^/', nullable: true }
        manifest: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        auditEventId: { type: string }
      additionalProperties: true
    RightsTransitionRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, enum: [under_review, mediation, resolved, appealed, closed] }
        resolutionSummary: { type: string, maxLength: 4000 }
        summary: { type: string, maxLength: 4000 }
        evidenceReferences: { type: array, maxItems: 20, items: { type: string, maxLength: 240 } }
      additionalProperties: false
    RightsAppealRequest:
      type: object
      properties:
        summary: { type: string, minLength: 10, maxLength: 4000 }
        resolutionSummary: { type: string, minLength: 10, maxLength: 4000 }
        evidenceReferences: { type: array, maxItems: 20, items: { type: string, maxLength: 240 } }
      additionalProperties: false
    RightsTransitionResponse:
      type: object
      required: [id, status, auditEventId]
      properties:
        id: { type: string }
        status: { type: string, enum: [under_review, mediation, resolved, appealed, closed] }
        auditEventId: { type: string }
      additionalProperties: false
    StreamUploadRequest:
      type: object
      required: [filename, contentType]
      properties:
        filename: { type: string, minLength: 1, maxLength: 240 }
        contentType: { type: string, pattern: '^video/' }
        maxDurationSeconds: { type: integer, minimum: 1, maximum: 36000, default: 3600 }
      additionalProperties: false
    StreamUpload:
      type: object
      required: [assetId, streamUid, uploadUrl, expiresAt, status]
      properties:
        assetId: { type: string }
        streamUid: { type: string }
        uploadUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
        status: { type: string, enum: [uploading, processing, ready, error] }
        auditEventId: { type: string }
      additionalProperties: false
    StreamPlayback:
      type: object
      required: [assetId, streamUid, iframeUrl, expiresInSeconds]
      properties:
        assetId: { type: string }
        streamUid: { type: string }
        iframeUrl: { type: string, format: uri }
        expiresInSeconds: { type: integer, minimum: 1 }
      additionalProperties: false
    StreamWebhookRequest:
      type: object
      properties:
        uid: { type: string }
        state: { type: string }
        readyToStream: { type: boolean }
        pctComplete: { oneOf: [{ type: string }, { type: number }] }
        status: { oneOf: [{ type: string }, { type: object, additionalProperties: true }] }
        errorReasonCode: { type: string, nullable: true }
        errorReasonText: { type: string, nullable: true }
      additionalProperties: true
    StreamWebhookResponse:
      type: object
      required: [accepted, streamUid, state, progress, status]
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        streamUid: { type: string }
        state: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        status: { type: string, enum: [uploading, processing, ready, error] }
      additionalProperties: true
    AuditExportRequest:
      type: object
      required: [streamId, residencyRegion]
      properties:
        streamId: { type: string }
        residencyRegion: { type: string, enum: [za, eu] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
      additionalProperties: false
    AuditExportResponse:
      type: object
      required: [exportId, download]
      properties:
        exportId: { type: string }
        download: { type: string, pattern: '^/' }
      additionalProperties: true
    AuditEventsResponse:
      type: object
      required: [streamId, residencyRegion, events]
      properties:
        streamId: { type: string }
        residencyRegion: { type: string, enum: [za, eu] }
        events: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: true
    VerificationCaseResponse:
      type: object
      required: [case, documents]
      properties:
        case: { type: object, additionalProperties: true }
        documents: { type: array, items: { $ref: '#/components/schemas/VerificationDocument' } }
      additionalProperties: false
    VerificationDocument:
      type: object
      required: [id, document_type, content_sha256, created_at]
      properties:
        id: { type: string }
        document_type: { type: string }
        content_sha256: { type: string }
        issued_country: { type: string, nullable: true }
        expires_at: { type: string, nullable: true }
        created_at: { type: string }
        uploaded_at: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
      additionalProperties: false
    VerificationDocumentRequest:
      type: object
      required: [documentType, contentSha256]
      properties:
        documentType: { type: string, enum: [government_id, proof_of_address, business_registration, beneficial_owner_register, bank_account_proof] }
        contentSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        issuedCountry: { type: string, minLength: 2, maxLength: 2 }
        expiresAt: { type: string, format: date-time }
      additionalProperties: false
    VerificationDocumentResponse:
      type: object
      required: [documentId, upload, retentionUntil]
      properties:
        documentId: { type: string }
        upload: { type: string }
        retentionUntil: { type: string, format: date-time }
      additionalProperties: false
    VerificationDocumentUploadResponse:
      type: object
      required: [documentId, uploaded, sizeBytes]
      properties:
        documentId: { type: string }
        uploaded: { type: boolean }
        sizeBytes: { type: integer, minimum: 1 }
      additionalProperties: false
    VerificationOcrResponse:
      type: object
      required: [resultId, documentId, model, extracted, validation]
      properties:
        resultId: { type: string }
        documentId: { type: string }
        model: { type: string }
        extracted: { type: object, additionalProperties: true }
        validation: { type: object, additionalProperties: true }
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        retryAfter: { type: integer, minimum: 0 }
        quotaBytes: { type: integer, minimum: 1 }
        uploadId: { type: string }
