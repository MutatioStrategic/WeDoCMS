openapi: 3.0.3
info:
  title: Veld Archive API
  version: 0.1.0
  description: Core API for trusted South African visual discovery, ingestion, rights, and governance.
servers:
  - url: https://archive.example.com
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Return the current browser session
      responses:
        '200':
          description: Authenticated or anonymous session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/exchange:
    post:
      operationId: exchangeIdentityToken
      summary: Exchange a verified bearer identity token for a session cookie
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/assets:
    get:
      operationId: searchAssets
      summary: Search published assets
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 240, default: '' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, image, video], default: all }
        - name: location
          in: query
          schema: { type: string, maxLength: 80 }
        - name: locationType
          in: query
          description: Pixel-derived visible setting classification; never a geographic claim
          schema: { type: string, enum: [urban_street, coastal_landscape, market_scene, indoor, residential, rural_landscape, industrial, event, transport, nature, sports, food, other, unknown] }
        - name: category
          in: query
          schema: { type: string, enum: [people, lifestyle, travel, nature, architecture, food, business, transport, arts_culture, sport, news_editorial, objects, other] }
        - name: status
          in: query
          schema: { type: string, enum: [published, needs_review, all], default: published }
        - name: verified
          in: query
          schema: { type: string, enum: ['true'] }
      responses:
        '200':
          description: Explainable search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createAsset
      summary: Create an asset metadata record
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: Asset created
          headers:
            Location:
              description: Relative URL of the created asset resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetCreateResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Metadata or pricing rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications/{id}/read:
    post:
      operationId: markNotificationRead
      summary: Mark one notification as read
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Notification marked read
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { type: boolean, enum: [true] } }
                additionalProperties: false
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches:
    get:
      operationId: listPayoutBatches
      summary: List payout batches awaiting review or processing
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Payout batches
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/PayoutBatchSummary' } }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createPayoutBatch
      summary: Create a payout batch draft for admin approval
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutBatchRequest' }
      responses:
        '201':
          description: Draft created; no provider payout has started
          headers:
            Location:
              description: Relative URL of the draft payout batch
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchCreateResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches/{id}:
    get:
      operationId: getPayoutBatch
      summary: Inspect payout contributors and batch status
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Payout batch detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDetail' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Payout batch not found in this organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/payout-batches/{id}/decision:
    post:
      operationId: decidePayoutBatch
      summary: Approve or reject a payout batch before provider processing
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PayoutBatchDecisionRequest' }
      responses:
        '200':
          description: Draft rejected or idempotent decision confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDecisionResponse' }
        '202':
          description: Draft approved and provider processing queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PayoutBatchDecisionResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Batch is no longer a draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/governance/assets/{id}/action:
    post:
      operationId: runGovernanceAction
      summary: Correct metadata, approve, or reject an asset; upload completion runs AI once
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernanceActionRequest' }
      responses:
        '200':
          description: Governance state updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceActionResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Governance rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: AI enrichment is upload-only and cannot be requested from governance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/photo-jobs:
    get:
      operationId: listPhotoJobs
      summary: List enrichment and index jobs for operational review
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, queued, running, completed, needs_review, failed, dead_lettered, skipped], default: all }
      responses:
        '200':
          description: Tenant-scoped photo jobs
          content:
            application/json:
              schema:
                type: object
                required: [status, results]
                properties:
                  status: { type: string }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                additionalProperties: true
        '403':
          description: Editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/approval-ledger:
    get:
      operationId: listAdminApprovalLedger
      summary: List tenant-scoped user-account and image approval sign-offs
      security:
        - sessionCookie: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [all, user_account, image], default: all }
        - name: source
          in: query
          schema: { type: string, enum: [all, signed_audit, workflow_event], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: Approval ledger rows with integrity state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalLedgerResponse' }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/photo-jobs/{jobId}/provenance:
    get:
      operationId: getPhotoJobProvenance
      summary: Inspect model, revision, prompt/schema version, attempt, and review outcomes
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Photo job provenance
          content:
            application/json:
              schema:
                type: object
                required: [jobId, results]
                properties:
                  jobId: { type: string }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                additionalProperties: true
  /api/admin/photo-jobs/{jobId}/replay:
    post:
      operationId: replayPhotoJob
      summary: Replay a failed index-sync job; upload-time AI enrichment is never replayed
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Job queued for a fresh bounded attempt
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status, replayed]
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [queued] }
                  replayed: { type: boolean, enum: [true] }
                additionalProperties: false
        '404':
          description: Replayable job not found in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: AI enrichment is upload-only or the job is not replayable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/photo-jobs/{jobId}/re-enrich:
    post:
      operationId: reEnrichPhotoJob
      summary: Explicitly re-run an image enrichment job for an admin-controlled review
      security:
        - sessionCookie: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: { type: string, enum: [re-enrich] }
      responses:
        '202':
          description: Enrichment queued
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status, reEnriched]
                properties:
                  jobId: { type: string }
                  status: { type: string, enum: [queued] }
                  reEnriched: { type: boolean, enum: [true] }
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/admin/analytics/audit-search:
    get:
      operationId: searchAdminAuditAnalytics
      summary: Search tenant-scoped audit history across D1 and the optional R2 Data Catalog copy
      security:
        - sessionCookie: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: action
          in: query
          schema: { type: string, pattern: '^[a-z0-9._:-]{2,120}$' }
        - name: resourceType
          in: query
          schema: { type: string, pattern: '^[A-Za-z0-9._:-]{1,80}$' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Tenant-scoped merged audit search results and connector status
          content:
            application/json:
              schema:
                type: object
                required: [organization, filters, connectors, results]
                properties:
                  organization: { type: object, additionalProperties: true }
                  filters: { type: object, additionalProperties: true }
                  connectors: { type: object, additionalProperties: true }
                  results: { type: array, items: { type: object, additionalProperties: true } }
                additionalProperties: false
        '403':
          description: Admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/analytics/contributor/revenue:
    get:
      operationId: getContributorRevenueStatement
      summary: Read an owner-scoped licence and subscription royalty statement
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owner-scoped statement with privacy-preserving buyer and payout details
          content:
            application/json:
              schema:
                type: object
                required: [statement]
                properties:
                  statement:
                    type: object
                    required: [performance]
                    properties:
                      performance:
                        type: object
                        required: [range, summary, assets]
                        properties:
                          range: { type: string }
                          summary:
                            type: object
                            required: [views, downloads, subscriptionDownloads, licensedAssets, royaltyCents, roiStatus, roiExplanation]
                            properties:
                              views: { type: integer, minimum: 0 }
                              downloads: { type: integer, minimum: 0 }
                              subscriptionDownloads: { type: integer, minimum: 0 }
                              licensedAssets: { type: integer, minimum: 0 }
                              royaltyCents: { type: integer, minimum: 0 }
                              roiStatus: { type: string, enum: [not_available] }
                              roiExplanation: { type: string }
                          assets:
                            type: array
                            items:
                              type: object
                              required: [id, title, kind, views, downloads, subscriptionDownloads, licenceCount, royaltyCents, royaltyPerThousandViewsCents]
                              properties:
                                id: { type: string }
                                title: { type: string }
                                kind: { type: string, enum: [image, video] }
                                views: { type: integer, minimum: 0 }
                                downloads: { type: integer, minimum: 0 }
                                subscriptionDownloads: { type: integer, minimum: 0 }
                                licenceCount: { type: integer, minimum: 0 }
                                royaltyCents: { type: integer, minimum: 0 }
                                royaltyPerThousandViewsCents: { type: integer, minimum: 0, nullable: true }
                    additionalProperties: true
                additionalProperties: false
        '403':
          description: Contributor or admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/analytics/contributor/revenue.csv:
    get:
      operationId: downloadContributorRevenueCsv
      summary: Download the authenticated seller statement as CSV
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owner-scoped CSV statement
          content:
            text/csv: { schema: { type: string } }
        '403':
          description: Contributor or admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/analytics/contributor/revenue.pdf:
    get:
      operationId: downloadContributorRevenuePdf
      summary: Download the authenticated seller statement as PDF
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Owner-scoped presentation-ready PDF statement
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '403':
          description: Contributor or admin access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads:
    post:
      operationId: createUploadSession
      summary: Create a direct R2 upload session
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadRequest' }
      responses:
        '201':
          description: Short-lived upload URL returned
          headers:
            Location:
              description: Relative URL of the upload completion resource
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadResponse' }
        '401':
          description: Contributor authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/uploads/{uploadId}/complete:
    post:
      operationId: completeUpload
      summary: Verify the R2 object and complete ingestion
      security:
        - sessionCookie: []
      parameters:
        - name: uploadId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Upload completed or idempotently confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadCompleteResponse' }
        '403':
          description: Upload ownership check failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Upload session not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/buyer/licence-auto-approval:
    get:
      operationId: getBuyerLicenceAutoApproval
      summary: Get the signed-in buyer's licence auto-approval preference
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Buyer-controlled auto-approval setting and scope
          content:
            application/json:
              schema:
                type: object
                required: [enabled, termsVersion, scope, policy]
                properties:
                  enabled: { type: boolean }
                  termsVersion: { type: string }
                  signedAt: { type: string, nullable: true }
                  signedBy: { type: string, nullable: true }
                  revokedAt: { type: string, nullable: true }
                  updatedAt: { type: string, nullable: true }
                  scope: { type: string, enum: [validated_paid_licence_requests] }
                  policy: { type: object, additionalProperties: true }
        '403': { description: Buyer access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    put:
      operationId: updateBuyerLicenceAutoApproval
      summary: Enable or revoke buyer-signed licence auto-approval
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, acknowledged, termsVersion]
              properties:
                enabled: { type: boolean }
                acknowledged: { type: boolean, description: Must be true when enabling auto-approval }
                termsVersion: { type: string, example: licence-auto-approval-v1 }
      responses:
        '200':
          description: Updated buyer auto-approval preference with audit event reference
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '403': { description: Buyer access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: Current sign-off terms were not acknowledged, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { description: Signed audit record unavailable; setting remains unchanged, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/admin/licence-approvals:
    get:
      operationId: getAdminLicenceApprovals
      summary: Show buyer auto-approval preferences and auto-approved licence requests for the organisation
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Tenant-scoped buyer licence approval report
          content:
            application/json:
              schema:
                type: object
                required: [organization, summary, preferences, autoApprovedRequests, operationalAuditEvents]
                properties:
                  organization: { type: object, additionalProperties: true }
                  summary: { type: object, additionalProperties: true }
                  preferences: { type: array, items: { type: object, additionalProperties: true } }
                  autoApprovedRequests: { type: array, items: { type: object, additionalProperties: true } }
                  operationalAuditEvents: { type: array, items: { type: object, additionalProperties: true } }
        '403': { description: Admin access required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/checkout/validate:
    post:
      operationId: validateCheckout
      summary: Validate rights and releases before checkout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LicenceRequest' }
      responses:
        '200':
          description: Licence validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CheckoutValidationResponse' }
        '404':
          description: Asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Invalid licence request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/payments/{licenceId}/session:
    post:
      operationId: createPaymentSession
      summary: Create a hosted payment-provider checkout session for a pending licence
      security:
        - sessionCookie: []
      parameters:
        - name: licenceId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '201':
          description: Hosted checkout URL returned
          headers:
            Location:
              description: Relative URL of the hosted payment session resource
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [licenceId, provider, checkoutUrl, status]
                properties:
                  licenceId: { type: string }
                  provider: { type: string }
                  checkoutUrl: { type: string }
                  status: { type: string }
                additionalProperties: true
        '401':
          description: Authenticated buyer required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: Payment provider is unavailable or unconfigured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/my/purchases:
    get:
      operationId: listMyPurchases
      summary: List the signed-in buyer's complete purchase history
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Licences, photographer subscriptions, platform membership payments, and credit purchases ordered newest first
          content:
            application/json:
              schema:
                type: object
                required: [results, summary]
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
                  summary: { type: object, additionalProperties: true }
        '401': { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /api/my/credits:
    get:
      operationId: getMyCredits
      summary: Get the signed-in buyer's credit balance and credit ledger
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Available credits, transactions, and pending purchases
          content:
            application/json:
              schema:
                type: object
                required: [oneCreditCents, balanceCredits, transactions, pendingPurchases]
                properties:
                  oneCreditCents: { type: integer, example: 10000 }
                  balanceCredits: { type: integer, minimum: 0 }
                  transactions: { type: array, items: { type: object, additionalProperties: true } }
