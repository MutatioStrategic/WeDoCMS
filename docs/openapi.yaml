openapi: 3.0.3
info:
  title: Stockvel API
  version: 0.1.0
  description: Core API for trusted South African visual discovery, ingestion, rights, and governance.
servers:
  - url: https://archive.example.com
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/session:
    get:
      operationId: getSession
      summary: Return the current browser session
      responses:
        '200':
          description: Authenticated or anonymous session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
  /api/auth/config:
    get:
      operationId: getAuthConfig
      summary: Return the public authentication configuration for this deployment
      responses:
        '200':
          description: Supabase, demo, or intentionally unavailable authentication configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfigResponse'
  /api/auth/demo-login:
    post:
      operationId: createDemoSession
      summary: Start an explicitly non-production demo session
      description: Demo authentication is available only when the Worker enables the demo environment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
      responses:
        '200':
          description: Demo session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '400':
          description: Unsupported demo role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Demo seed identity is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/exchange:
    post:
      operationId: exchangeIdentityToken
      summary: Exchange a verified bearer identity token for a session cookie
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeRequest'
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedSessionResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/assets:
    get:
      operationId: searchAssets
      summary: Search approved assets with deterministic metadata ranking
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 240, default: '' }
        - name: kind
          in: query
          schema: { type: string, enum: [all, image, video], default: all }
        - name: location
          in: query
          schema: { type: string, maxLength: 80 }
        - name: locationType
          in: query
          schema: { type: string, maxLength: 80 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: verified
          in: query
          schema: { type: string, enum: ["true"] }
        - name: status
          in: query
          schema: { type: string, enum: [published, needs_review, all], default: published }
        - name: sort
          in: query
          schema: { type: string, enum: [relevance, newest, popular, random], default: relevance }
        - name: orientation
          in: query
          schema: { type: string, enum: [all, landscape, portrait, square], default: all }
        - name: usage
          in: query
          schema: { type: string, enum: [all, commercial, editorial], default: all }
        - name: people
          in: query
          schema: { type: string, enum: [all, with_people, without_people], default: all }
        - name: ai
          in: query
          schema: { type: string, enum: [all, ai_generated, not_ai_generated], default: all }
        - name: exclude
          in: query
          schema: { type: string, maxLength: 240 }
        - name: cursor
          in: query
          schema: { type: string, pattern: '^\\d+$' }
      responses:
        '200':
          description: Explainable search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid search query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createAsset
      summary: Create an asset metadata record
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreateRequest'
      responses:
        '201':
          description: Asset created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetCreateResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Contributor or editor access required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Metadata or pricing rule failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/search:
    get:
      operationId: searchApprovedMetadata
      summary: Search approved assets with General metadata matching or AI metadata-vector retrieval
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 240, default: '' }
        - name: mode
          in: query
          description: General uses literal title/description matching. AI interprets a natural-language brief against vectors built from current approved metadata; it never re-analyses source images at query time.
          schema: { type: string, enum: [general, ai], default: general }
        - name: kind
          in: query
          schema: { type: string, enum: [all, image, video], default: all }
        - name: location
          in: query
          schema: { type: string, maxLength: 80 }
        - name: locationType
          in: query
          schema: { type: string, maxLength: 80 }
        - name: category
          in: query
          schema: { type: string, maxLength: 80 }
        - name: verified
          in: query
          schema: { type: string, enum: ["true"] }
        - name: status
          in: query
          schema: { type: string, enum: [published, needs_review, all], default: published }
      responses:
        '200':
          description: Ranked published metadata search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400':
          description: Invalid search query
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The selected General or AI metadata search service is temporarily unavailable
  /api/assets/{id}:
    get:
      operationId: getAsset
      summary: Get a published asset or an asset visible to its tenant reviewer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Asset detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404':
          description: Asset not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/notifications:
    get:
      operationId: listNotifications
      summary: List notifications for the current user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes:
    get:
      operationId: listLightboxes
      summary: List the current user's lightboxes
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Tenant-scoped lightboxes
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/Lightbox' } }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      operationId: createLightbox
      summary: Create a private lightbox
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                description: { type: string, maxLength: 500 }
                visibility: { type: string, enum: [private, shared], default: private }
              additionalProperties: false
      responses:
        '201':
          description: Lightbox created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lightbox' }
        '409':
          description: Duplicate lightbox name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/assets:
    post:
      operationId: saveAssetToLightbox
      summary: Save a published asset to a lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetId]
              properties:
                assetId: { type: string }
              additionalProperties: false
      responses:
        '200': { description: Asset saved (idempotent) }
        '404':
          description: Lightbox or published asset not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/assets/{assetId}:
    delete:
      operationId: removeAssetFromLightbox
      summary: Remove an asset from a lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Asset removed }
  /api/lightboxes/{id}:
    delete:
      operationId: deleteLightbox
      summary: Delete an owned lightbox
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Lightbox deleted }
        '404':
          description: Lightbox not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/lightboxes/{id}/share-link:
    post:
      operationId: createLightboxShareLink
      summary: Create or rotate a public lightbox share link
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Share link created }
        '404': { description: Lightbox not found }
  /api/lightboxes/{id}/members:
    post:
      operationId: addLightboxMember
      summary: Add an organization member as viewer or editor
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Member added }
        '422': { description: Member is outside the organization }
  /api/lightboxes/shared/{token}:
    get:
      operationId: viewSharedLightbox
      summary: View a published shared lightbox without authentication
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Shared lightbox and published assets }
        '404': { description: Shared lightbox not found }
  /api/search/visual:
    post:
      operationId: visualSearch
      summary: Visual search is intentionally disabled while live search is metadata-only
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary }
      responses:
        '503':
          description: Visual search is disabled; use title or description search
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/creators:
    get:
      operationId: listCreators
      summary: Discover contributors who explicitly published a public profile
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200':
          description: Public creator profiles
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/CreatorProfile' } }
  /api/creators/{slug}:
    get:
      operationId: getCreator
      summary: Return one public creator profile with published assets and collections
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9-]{3,100}$' } }
      responses:
        '200': { description: Public creator detail }
        '404': { description: Creator not found or not public }
  /api/licence-products:
    get:
      operationId: listLicenceProducts
      summary: Return active, versioned licence products and restrictions
      responses:
        '200':
          description: Active licence products
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/LicenceProduct' } }
  /api/discovery:
    get:
      operationId: getDiscovery
      summary: Return privacy-thresholded trends and optional personalized discovery
      responses:
        '200':
          description: Public trends plus tenant-scoped saved searches and recommendations when authenticated
          content:
            application/json:
              schema:
                type: object
                required: [trending, savedSearches, recommendations, personalized]
                properties:
                  trending:
                    type: array
                    items:
                      type: object
                      required: [query, searchCount]
                      properties: { query: { type: string }, searchCount: { type: integer, minimum: 3 } }
                  savedSearches: { type: array, items: { $ref: '#/components/schemas/SavedSearch' } }
                  recommendations:
                    type: array
                    items:
                      type: object
                      required: [asset, reason]
                      properties: { asset: { $ref: '#/components/schemas/Asset' }, reason: { type: string } }
                  personalized: { type: boolean }
  /api/saved-searches:
    post:
      operationId: createSavedSearch
      summary: Save a tenant-scoped search and optional in-app alert cadence
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchInput' }
      responses:
        '201':
          description: Saved search created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '409':
          description: Duplicate saved-search name
  /api/saved-searches/{id}:
    patch:
      operationId: updateSavedSearch
      summary: Update an owned saved search or alert cadence
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchInput' }
      responses:
        '200':
          description: Saved search updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
    delete:
      operationId: deleteSavedSearch
      summary: Delete an owned saved search
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Saved search deleted }
        '404': { description: Saved search not found }
  /api/ops/readiness:
    get:
      operationId: getProductionReadiness
      summary: Return the admin-only fail-closed production readiness gate
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Readiness checks without secret values
          content:
            application/json:
              schema:
                type: object
                required: [ready, checkedAt, checks]
                properties:
                  ready: { type: boolean }
                  checkedAt: { type: string, format: date-time }
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, ready, action]
                      properties: { id: { type: string }, ready: { type: boolean }, action: { type: string } }
        '403': { description: Admin access required }
  /api/onboarding/seller:
    put:
      operationId: saveSellerOnboarding
      summary: Persist the authenticated seller profile and versioned seller agreement acceptance
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sellerType, legalName, phone, ageConfirmed, identityDocumentType, bankAccountName, copyrightDeclaration, taxResponsibilityDeclaration, contributorAgreement, termsVersion]
              properties:
                sellerType: { type: string, enum: [individual, company] }
                legalName: { type: string }
                phone: { type: string }
                ageConfirmed: { type: boolean, enum: [true] }
                identityDocumentType: { type: string, enum: [sa_id, passport] }
                bankAccountName: { type: string }
                copyrightDeclaration: { type: boolean, enum: [true] }
                taxResponsibilityDeclaration: { type: boolean, enum: [true] }
                contributorAgreement: { type: boolean, enum: [true] }
                termsVersion: { type: string, description: Must match the current seller agreement version shown in the review widget. }
      responses:
        '200': { description: Seller profile saved }
        '403': { description: Contributor access required }
        '422': { description: Invalid or incomplete seller profile }
  /api/onboarding/cipc/lookup:
    post:
      operationId: verifyCipcRegistration
      summary: Verify the saved company registration through the configured CIPC adapter
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Company registration verified }
        '409': { description: A matching company seller profile is required }
        '503': { description: CIPC integration is unavailable or unconfigured }
  /api/onboarding/didit/session:
    post:
      operationId: createDiditVerificationSession
      summary: Create a hosted Didit KYC or KYB session for the authenticated seller
      security: [{ sessionCookie: [] }]
      responses:
        '201': { description: Didit hosted verification session created }
        '409': { description: Seller or CIPC prerequisite is incomplete }
        '503': { description: Didit integration is unavailable or unconfigured }
  /api/webhooks/didit:
    post:
      operationId: receiveDiditWebhook
      summary: Receive a signed, timestamped, deduplicated Didit decision event
      parameters:
        - { name: x-signature-v2, in: header, required: false, schema: { type: string } }
        - { name: x-signature, in: header, required: false, schema: { type: string } }
        - { name: x-timestamp, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Event accepted or already processed }
        '401': { description: Invalid or stale signature }
  /api/subscription:
    get:
      operationId: getBuyerSubscription
      summary: Return the signed-in buyer's canonical Paystack subscription, monthly/annual plans, and payment history
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Subscription state and plan configuration }
  /api/subscription/session:
    post:
      operationId: createBuyerSubscriptionSession
      summary: Start hosted checkout for the selected monthly or annual Paystack recurring plan
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [successUrl, cancelUrl]
              properties:
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
                plan: { type: string, enum: [monthly, annual], default: monthly }
      responses:
        '201': { description: Hosted subscription checkout created }
        '409': { description: Subscription is already active or pending }
        '503': { description: Paystack plan is unconfigured or unavailable }
  /api/my/free-downloads:
    get:
      operationId: getIntroductoryFreeDownloads
      summary: Return the authenticated buyer's one-time introductory photo allowance
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Allowance limit, used count, remaining count, and claimed photo history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeDownloadsResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/my/purchases:
    get:
      operationId: listBuyerPurchases
      summary: Return the buyer's licence, subscription, and credit purchase history
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Buyer purchase history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseHistoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/my/credits:
    get:
      operationId: getBuyerCredits
      summary: Return the authenticated buyer's credit balance and credit purchase activity
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Buyer credit wallet, transactions, and pending credit purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerCreditsResponse'
        '403':
          description: Authenticated buyer access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/account/lifecycle:
    get:
      operationId: getAccountLifecycle
      summary: Return account verification, notification, export, and deletion state
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Account lifecycle state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLifecycle'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/account/preferences:
    put:
      operationId: updateAccountPreferences
      summary: Update account notification preferences
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPreferencesRequest'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPreferencesResponse'
        '400':
          description: Invalid preferences payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/account/exports:
    post:
      operationId: requestAccountExport
      summary: Queue an account data export
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Export queued or an existing queued export returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountExportResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/account/deletion:
    post:
      operationId: requestAccountDeletion
      summary: Schedule account deletion with a recovery window
      security: [{ sessionCookie: [] }]
      responses:
        '202':
          description: Deletion request scheduled or existing request returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDeletionResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/assets/{id}/original:
    get:
      operationId: downloadOriginalAsset
      summary: Download an original using a licence, bundle credit, subscription, owner, staff, or introductory allowance entitlement
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1 } }
      responses:
        '302': { description: Short-lived signed R2 download redirect }
        '403': { description: Entitlement missing or introductory allowance exhausted }
  /api/buyer/credits/checkout:
    post:
      operationId: createBuyerCreditBundleCheckout
      summary: Start a once-off checkout for archive credits
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credits, successUrl, cancelUrl]
              properties:
                credits: { type: integer, minimum: 1, maximum: 100000, description: 'Credits to add to the buyer wallet; the buyer-facing product is credits, not a Rand offer.' }
                successUrl: { type: string, format: uri }
                cancelUrl: { type: string, format: uri }
      responses:
        '201':
          description: Once-off credit checkout created
          content:
            application/json:
              schema:
                type: object
                required: [purchaseId, provider, checkoutUrl, status, credits, currency]
                properties:
                  purchaseId: { type: string }
                  provider: { type: string }
                  checkoutUrl: { type: string, format: uri }
                  status: { type: string, enum: [created, pending] }
                  credits: { type: integer, minimum: 1 }
