name: D1 disaster-recovery backup

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export remote D1
        run: npx wrangler d1 export veld-archive --remote --skip-confirmation --output=d1-backup.sql
      - name: Upload backup to both R2 locations
        shell: bash
        run: |
          backup_id="$(date -u +%Y%m%dT%H%M%SZ)"
          for bucket in veld-archive-backups veld-archive-backups-dr; do
            npx wrangler r2 object put "$bucket/d1/veld-archive/$backup_id/d1-backup.sql" --file d1-backup.sql
          done
      - name: Verify backup artifact
        run: sha256sum d1-backup.sql
