$kind: http-example
request:
  url: "{{baseUrl}}/api/rights/cases/:id/transition"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: va_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "to": "mediation",
        "resolutionSummary": "string",
        "summary": "string",
        "evidenceReferences": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "string",
        "status": "mediation",
        "auditEventId": "string"
      }
order: 1000
