$kind: http-request
url: "{{baseUrl}}/api/rights/cases/:id/appeal"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "summary": "stringstring",
      "resolutionSummary": "stringstring",
      "evidenceReferences": [
        "string",
        "string"
      ]
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Appeal a resolved rights case as requester or asset owner.resources/examples
order: 1000
