$kind: http-request
url: "{{baseUrl}}/api/rights/cases/:id/transition"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "to": "mediation",
      "resolutionSummary": "string",
      "summary": "string",
      "evidenceReferences": [
        "string",
        "string"
      ]
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Apply a permitted reviewer rights-case transition.resources/examples
order: 1000
