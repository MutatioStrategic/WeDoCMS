$kind: http-example
request:
  url: "{{baseUrl}}/api/security/turnstile"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "token": "string",
        "action": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "verified": true,
        "reason": "string"
      }
order: 1000
