$kind: http-request
name: Return the signed-in buyer's canonical Paystack subscription, monthly/annual plans, and payment history
url: "{{baseUrl}}/api/subscription"
method: GET
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Return the signed-in buyer's canonical Paystack subscription, mo.resources/examples
order: 3000
