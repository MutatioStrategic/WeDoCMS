$kind: http-request
url: "{{baseUrl}}/api/governance/assets/:id/action"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "action": "run_ai_tagging",
      "title": "string",
      "caption": "string",
      "subjectTags": [
        "string",
        "str"
      ],
      "culturalTags": [
        "string",
        "string"
      ],
      "curatorNotes": "string",
      "rightsStatus": "editorial_only",
      "modelReleaseStatus": "not_required",
      "propertyReleaseStatus": "not_required",
      "aiTags": [
        "string",
        "string"
      ],
      "monetizationModel": "membership",
      "licensePriceCents": 10487052,
      "freeDownloadEnabled": false
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Run tagging, correct metadata, approve, or reject an asset.resources/examples
order: 1000
