$kind: http-request
url: "{{baseUrl}}/api/saved-searches/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "name": "string",
      "query": "string",
      "mediaKind": "all",
      "alertFrequency": "none"
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Update an owned saved search or alert cadence.resources/examples
order: 1000
