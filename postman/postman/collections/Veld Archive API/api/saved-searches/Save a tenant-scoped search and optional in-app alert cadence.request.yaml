$kind: http-request
url: "{{baseUrl}}/api/saved-searches"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "query": "string",
      "mediaKind": "all",
      "alertFrequency": "none"
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Save a tenant-scoped search and optional in-app alert cadence.resources/examples
order: 2000
