$kind: http-example
request:
  url: "{{baseUrl}}/api/saved-searches"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: va_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "name": "string",
        "query": "string",
        "mediaKind": "all",
        "alertFrequency": "none"
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: ""
order: 2000
