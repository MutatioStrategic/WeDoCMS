$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/exchange"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "organizationId": "string",
        "sessionTransport": "cookie",
        "accountIntent": "seller"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": "string",
        "code": "string",
        "retryAfter": 4141,
        "quotaBytes": 2089,
        "uploadId": "string",
        "issues": [
          {
            "path": [
              "",
              ""
            ],
            "code": "string"
          },
          {
            "path": [
              "",
              ""
            ],
            "code": "string"
          }
        ]
      }
order: 2000
