$kind: http-request
url: "{{baseUrl}}/api/lightboxes"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "description": "string",
      "visibility": "private"
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Create a private lightbox.resources/examples
order: 4000
