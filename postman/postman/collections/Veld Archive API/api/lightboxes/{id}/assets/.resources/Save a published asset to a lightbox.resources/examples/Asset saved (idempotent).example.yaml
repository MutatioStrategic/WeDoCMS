$kind: http-example
request:
  url: "{{baseUrl}}/api/lightboxes/:id/assets"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: va_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "assetId": "string"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
