$kind: http-request
url: "{{baseUrl}}/api/lightboxes/:id/assets/:assetId"
method: DELETE
pathVariables:
  id: string
  assetId: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Remove an asset from a lightbox.resources/examples
order: 1000
