$kind: http-request
url: "{{baseUrl}}/api/lightboxes/:id/assets"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "assetId": "string"
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Save a published asset to a lightbox.resources/examples
order: 2000
