$kind: http-request
url: "{{baseUrl}}/api/uploads"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "filename": "string",
      "contentType": "image/",
      "sizeBytes": 9913658104,
      "assetId": "string"
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Create a direct R2 upload session.resources/examples
order: 2000
