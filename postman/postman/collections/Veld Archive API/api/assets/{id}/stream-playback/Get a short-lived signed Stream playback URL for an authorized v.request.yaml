$kind: http-request
name: Get a short-lived signed Stream playback URL for an authorized viewer
url: "{{baseUrl}}/api/assets/:id/stream-playback"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Get a short-lived signed Stream playback URL for an authorized v.resources/examples
order: 1000
