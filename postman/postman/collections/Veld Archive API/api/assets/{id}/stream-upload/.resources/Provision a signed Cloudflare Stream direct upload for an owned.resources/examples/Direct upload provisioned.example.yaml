$kind: http-example
request:
  url: "{{baseUrl}}/api/assets/:id/stream-upload"
  method: POST
  headers:
    - key: Idempotency-Key
      value: string
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: va_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "filename": "string",
        "contentType": "video/",
        "maxDurationSeconds": 3600
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "assetId": "string",
        "streamUid": "string",
        "uploadUrl": "http://fFlfYDdonRSHdxZ.nuwNyz2mPuqclwYuJBzUl-7XPknnMqdLmJpYB21M7x1xRBB",
        "expiresAt": "1965-04-24T23:41:29.804Z",
        "status": "uploading",
        "auditEventId": "string"
      }
order: 1000
