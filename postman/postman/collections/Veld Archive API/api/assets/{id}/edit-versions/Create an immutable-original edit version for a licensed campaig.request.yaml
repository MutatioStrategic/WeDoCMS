$kind: http-request
name: Create an immutable-original edit version for a licensed campaign asset
url: "{{baseUrl}}/api/assets/:id/edit-versions"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "campaignId": "string",
      "licenceId": "string",
      "recipe": {},
      "note": ""
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Create an immutable-original edit version for a licensed campaig.resources/examples
order: 2000
