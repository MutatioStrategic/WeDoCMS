$kind: http-request
url: "{{baseUrl}}/api/assets/:id/edit-versions"
method: GET
headers:
  Accept: application/json
pathVariables:
  id: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/List authenticated edit versions for an asset.resources/examples
order: 1000
