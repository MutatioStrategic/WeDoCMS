$kind: http-request
url: "{{baseUrl}}/api/assets/:id/derivatives/:derivativeId/content"
method: PUT
headers:
  Content-Type: application/octet-stream
  Accept: application/json
pathVariables:
  id: string
  derivativeId: string
body:
  type: file
  content: {}
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Upload derivative bytes through the authenticated content route.resources/examples
order: 2000
