$kind: http-request
url: "{{baseUrl}}/api/assets/:id/derivatives"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  id: string
body:
  type: json
  content: |-
    {
      "editVersionId": "string",
      "campaignId": "string",
      "licenceId": "string",
      "variant": "landscape",
      "contentType": "string",
      "sizeBytes": 1275739,
      "width": 5786,
      "height": 9870
    }
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Register a derivative before uploading its authenticated content.resources/examples
order: 2000
