$kind: http-request
url: "{{baseUrl}}/api/campaign-bundles/:id/download"
method: GET
headers:
  Accept: application/zip
pathVariables:
  id: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Download an approved campaign bundle within its seven-day expiry.resources/examples
order: 1000
