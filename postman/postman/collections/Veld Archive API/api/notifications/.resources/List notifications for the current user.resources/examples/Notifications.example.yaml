    type: json
    content: |-
      {
        "results": [
          {
            "key_0": 8952.51156355973,
            "key_1": "string"
          },
          {
            "key_0": 6068.110828064778,
            "key_1": "string",
            "key_2": "string",
            "key_3": 631.758849088222
          }
        ]
      }
order: 1000
