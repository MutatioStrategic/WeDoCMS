$kind: http-request
name: List organization-scoped signed audit events for a permitted stream
url: "{{baseUrl}}/api/audit/events/:streamId?residencyRegion=eu&limit=358"
method: GET
headers:
  Accept: application/json
queryParams:
  residencyRegion: eu
  limit: "358"
pathVariables:
  streamId: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/List organization-scoped signed audit events for a permitted str.resources/examples
order: 1000
