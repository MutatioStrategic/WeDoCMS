$kind: http-example
request:
  url: "{{baseUrl}}/api/audit/exports/:exportId"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: va_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    exportId: string
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: string
order: 1000
