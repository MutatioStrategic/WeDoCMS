$kind: http-request
name: Download an audit export only as its owning organization administrator or service
url: "{{baseUrl}}/api/audit/exports/:exportId"
method: GET
headers:
  Accept: application/json
pathVariables:
  exportId: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Download an audit export only as its owning organization adminis.resources/examples
order: 1000
