$kind: http-request
name: Run organization-scoped assistive OCR on an uploaded KYC document
url: "{{baseUrl}}/api/verification/documents/:documentId/ocr"
method: POST
headers:
  Accept: application/json
pathVariables:
  documentId: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Run organization-scoped assistive OCR on an uploaded KYC documen.resources/examples
order: 1000
