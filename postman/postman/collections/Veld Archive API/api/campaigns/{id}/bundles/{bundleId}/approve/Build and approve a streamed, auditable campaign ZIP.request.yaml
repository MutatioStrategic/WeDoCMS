$kind: http-request
url: "{{baseUrl}}/api/campaigns/:id/bundles/:bundleId/approve"
method: POST
headers:
  Accept: application/json
pathVariables:
  id: string
  bundleId: string
auth:
  type: apikey
  credentials:
    key: va_session
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/Build and approve a streamed, auditable campaign ZIP.resources/examples
order: 1000
